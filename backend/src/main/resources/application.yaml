spring:
  application:
    name: hookflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hookflow}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: ${DATABASE_DRIVER_CLASS_NAME:org.postgresql.Driver}

database:
  type: ${DATABASE_TYPE:postgres}

mybatis:
  mapper-locations: classpath:mapper/${database.type}/**/*.xml
  type-handlers-package: com.hookflow.hookflow.common.mybatis
  configuration:
    map-underscore-to-camel-case: true

hookflow:
  cache:
    negative-ttl-seconds: ${HOOKFLOW_CACHE_NEGATIVE_TTL_SECONDS:30}
    l1:
      max-size: ${HOOKFLOW_CACHE_L1_MAX_SIZE:1000}
      ttl-seconds: ${HOOKFLOW_CACHE_L1_TTL_SECONDS:120}
    l2:
      enabled: ${HOOKFLOW_CACHE_L2_ENABLED:false}
      ttl-seconds: ${HOOKFLOW_CACHE_L2_TTL_SECONDS:300}
      key-prefix: ${HOOKFLOW_CACHE_L2_PREFIX:hookflow:apikey:}
  queue:
    type: ${HOOKFLOW_QUEUE_TYPE:sqs}
    name: ${HOOKFLOW_QUEUE_NAME:hookflow-events}
    retry:
      max-attempts: ${HOOKFLOW_QUEUE_RETRY_MAX_ATTEMPTS:3}
      initial-delay-ms: ${HOOKFLOW_QUEUE_RETRY_INITIAL_DELAY_MS:500}
      multiplier: ${HOOKFLOW_QUEUE_RETRY_MULTIPLIER:2.0}
      max-delay-ms: ${HOOKFLOW_QUEUE_RETRY_MAX_DELAY_MS:5000}
    sqs:
      region: ${HOOKFLOW_QUEUE_SQS_REGION:us-east-1}
      endpoint: ${HOOKFLOW_QUEUE_SQS_ENDPOINT:}
      queue-url: ${HOOKFLOW_QUEUE_SQS_QUEUE_URL:}
  publisher:
    recovery:
      enabled: ${HOOKFLOW_PUBLISHER_RECOVERY_ENABLED:true}
      interval-ms: ${HOOKFLOW_PUBLISHER_RECOVERY_INTERVAL_MS:30000}
      batch-size: ${HOOKFLOW_PUBLISHER_RECOVERY_BATCH_SIZE:50}
